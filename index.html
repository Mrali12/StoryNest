<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest — English & Urdu Stories</title>
<meta name="description" content="StoryNest — read English and Urdu stories: romance, horror, adventure, comedy and more, all in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14110F; --surface:#1E1A16; --surface2:#241F19; --border:#332C24;
    --paper:#F2E8D5; --paper-dim:#DCCFAE;
    --gold:#C9A227; --gold-bright:#E4BE3E; --maroon:#8A3324;
    --text:#EDE6DA; --text-dim:#A99E8C; --danger:#B4443A; --good:#4E7C4A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    color:var(--text); font-family:'Inter',sans-serif; line-height:1.5; min-height:100vh;
    background-color:var(--ink);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,39,.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(138,51,36,.14), transparent 60%);
    background-attachment:fixed, fixed;
  }
  h1,h2,h3,.serif{font-family:'Lora',serif;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .urdu{font-family:'Noto Nastaliq Urdu', serif; direction:rtl; line-height:2.1;}

  header{position:sticky; top:0; z-index:40; background:rgba(20,17,15,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--border);}
  .header-inner{max-width:1100px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .logo{font-size:1.5rem; font-weight:700; color:var(--paper); letter-spacing:.3px; display:flex; align-items:center; gap:8px; white-space:nowrap;}
  .logo span{color:var(--gold);}
  .header-actions{margin-left:auto; display:flex; align-items:center; gap:10px;}
  .btn{border:1px solid var(--gold); background:transparent; color:var(--gold); padding:8px 16px; font-size:.85rem; font-weight:600; border-radius:8px; transition:.15s;}
  .btn:hover{background:var(--gold); color:var(--ink);}
  .btn-solid{background:var(--gold); color:var(--ink); border:1px solid var(--gold);}

  .hero{max-width:1100px; margin:0 auto; padding:56px 18px 28px; text-align:center;}
  .hero h1{font-size:2.4rem; color:var(--paper); font-weight:600; line-height:1.25;}
  .hero h1 em{color:var(--gold); font-style:normal;}
  .hero p{margin-top:12px; color:var(--text-dim); font-size:1.02rem; max-width:520px; margin-left:auto; margin-right:auto;}

  .chip-row{max-width:1100px; margin:0 auto; padding:0 18px 26px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .chip{border:1px solid var(--border); background:var(--surface); color:var(--text-dim); padding:7px 15px; font-size:.85rem; border-radius:20px; transition:all .15s;}
  .chip.active,.chip:hover{border-color:var(--gold); color:var(--gold);}

  .grid-wrap{max-width:1100px; margin:0 auto; padding:0 18px 60px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:22px;}
  .card{background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--maroon); border-radius:14px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:.15s;}
  .card:hover{transform:translateY(-3px); border-top-color:var(--gold);}
  .card-cover{aspect-ratio:3/4; background:linear-gradient(150deg,var(--surface2),var(--ink)); display:flex; align-items:center; justify-content:center; position:relative;}
  .lang-badge{position:absolute; top:8px; left:8px; background:rgba(20,17,15,.85); color:var(--gold); font-size:.68rem; font-weight:700; padding:3px 8px;}
  .card-body{padding:14px 14px 16px; flex:1; display:flex; flex-direction:column;}
  .card-cat{color:var(--maroon); font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
  .card-title{font-family:'Lora',serif; font-size:1.08rem; font-weight:600; color:var(--paper); margin:5px 0 6px; line-height:1.3;}
  .card-snip{color:var(--text-dim); font-size:.83rem; flex:1; line-height:1.5;}
  .card-meta{display:flex; gap:14px; margin-top:10px; font-size:.76rem; color:var(--text-dim);}

  .listen-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); padding:12px 16px; margin:18px 0 26px; border-radius:8px;}
  .listen-btn{width:38px; height:38px; border-radius:50%; background:var(--gold); color:var(--ink); border:none; font-size:1rem;}
  .listen-btn.stop{background:var(--danger); color:#fff;}
  .speed-row{display:flex; gap:6px; margin-left:auto;}
  .speed-btn{border:1px solid var(--border); background:var(--ink); color:var(--text-dim); font-size:.78rem; padding:6px 10px; border-radius:14px;}
  .speed-btn.active{border-color:var(--gold); color:var(--gold);}

  .overlay{position:fixed; inset:0; background:rgba(10,8,6,.72); z-index:100; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:30px 14px;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; max-width:500px; width:100%; padding:28px 24px; margin-top:20px; position:relative;}
  .modal h2{font-family:'Lora',serif; color:var(--paper); font-size:1.3rem; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.82rem; color:var(--text-dim); margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%; background:var(--ink); border:1px solid var(--border); color:var(--text); padding:9px 12px; font-size:.9rem; border-radius:8px; font-family:inherit;}
  .field textarea{min-height:160px; resize:vertical; line-height:1.6;}
  .modal-close{position:absolute; top:10px; right:14px; background:none; border:none; color:var(--text-dim); font-size:1.5rem; line-height:1;}

  .reader{background:var(--ink); max-width:720px; width:100%; margin-top:0; padding:0; min-height:100vh;}
  .reader-top{position:sticky; top:0; background:rgba(20,17,15,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; z-index:5;}
  .reader-body{padding:26px 24px 60px;}
  .reader-cat{color:var(--maroon); font-weight:700; font-size:.78rem; text-transform:uppercase; letter-spacing:.5px;}
  .reader-title{font-family:'Lora',serif; font-size:1.7rem; color:var(--paper); margin:8px 0 6px; line-height:1.3;}
  .reader-content{font-size:1.05rem; color:var(--text); white-space:pre-wrap; line-height:1.85;}
  .reader-content.urdu{font-size:1.35rem;}
  .reader-actions{display:flex; gap:10px; margin-top:34px; padding-top:22px; border-top:1px solid var(--border);}

  #toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--paper); color:var(--ink); padding:11px 22px; border-radius:8px; font-size:.88rem; font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:.25s;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">📖Story<span>Nest</span></div>
    <div class="header-actions">
      <button class="btn" onclick="openAdmin()">Admin Panel</button>
    </div>
  </div>
</header>

<div class="hero">
  <h1>Stories that stay with you — <em>English & Urdu</em></h1>
  <p>Romance, horror, adventure, comedy and more. Read and Listen in one place.</p>
</div>

<div class="chip-row" id="categoryChips">
  <button class="chip active" data-cat="All">All</button>
  <button class="chip" data-cat="Romance">Romance</button>
  <button class="chip" data-cat="Horror">Horror</button>
  <button class="chip" data-cat="Adventure">Adventure</button>
  <button class="chip" data-cat="Comedy">Comedy</button>
</div>

<div class="grid-wrap">
  <div class="listen-bar">
    <button class="listen-btn" id="ttsBtn">🔊</button>
    <span id="ttsLabel">Select a story to Listen</span>
    <div class="speed-row">
      <button class="speed-btn" data-speed="0.8">0.8x</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="1.25">1.25x</button>
    </div>
  </div>
  <div class="grid" id="storyGrid"></div>
</div>

<!-- ADMIN MODAL -->
<div id="adminModal" class="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeAdmin()">&times;</button>
    <h2>Add New Story</h2>
    <div class="field">
      <label>Story Title</label>
      <input type="text" id="storyTitle">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="storyCategory">
        <option>Romance</option>
        <option>Horror</option>
        <option>Adventure</option>
        <option>Comedy</option>
      </select>
    </div>
    <div class="field">
      <label>Language</label>
      <select id="storyLang">
        <option value="en">English</option>
        <option value="ur">Urdu</option>
      </select>
    </div>
    <div class="field">
      <label>Story Content</label>
      <textarea id="storyContent"></textarea>
    </div>
    <button class="btn-solid" style="width:100%" onclick="addStory()">Publish Story</button>
  </div>
</div>

<!-- READER MODAL -->
<div id="readerModal" class="overlay">
  <div class="reader">
    <div class="reader-top">
      <button class="btn" onclick="closeReader()">← Back</button>
    </div>
    <div class="reader-body">
      <div class="reader-cat" id="rCat"></div>
      <h1 class="reader-title" id="rTitle"></h1>
      <div class="reader-content" id="rContent"></div>
      <div class="reader-actions">
        <button class="btn" id="readAloudBtn">🔊 Read Aloud</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let stories = [
  {id:1, title:"Chand Ka Safar", cat:"Adventure", lang:"ur", content:"Ek chota larka chaand tak jana chahta tha. Wo roz raat ko chaand ko dekhta aur sochta ke kaash main wahan ja sakun."},
  {id:2, title:"The Lost Key", cat:"Horror", lang:"en", content:"Sarah found an old key in her grandmother's attic. It didn't fit any door in the house. At night she heard footsteps..."}
];
let currentStory = null;
let currentSpeech = null;
let speechRate = 1;

function renderStories(filter="All"){
  const grid = document.getElementById('storyGrid');
  grid.innerHTML = '';
  const filtered = filter==="All" ? stories : stories.filter(s=>s.cat===filter);
  
  filtered.forEach(s=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-cover"><span class="lang-badge">${s.lang==='ur'?'UR':'EN'}</span></div>
      <div class="card-body">
        <div class="card-cat">${s.cat}</div>
        <div class="card-title">${s.title}</div>
        <div class="card-snip">${s.content.substring(0,80)}...</div>
      </div>
    `;
    card.onclick = ()=>openReader(s);
    grid.appendChild(card);
  });
}

function openAdmin(){ document.getElementById('adminModal').classList.add('show'); }
function closeAdmin(){ document.getElementById('adminModal').classList.remove('show'); }

function addStory(){
  const title = document.getElementById('storyTitle').value;
  const cat = document.getElementById('storyCategory').value;
  const lang = document.getElementById('storyLang').value;
  const content = document.getElementById('storyContent').value;
  
  if(!title || !content){ showToast("Title aur Content likhna zaroori hai"); return; }
  
  stories.push({id:Date.now(), title, cat, lang, content});
  renderStories();
  closeAdmin();
  showToast("Story Published!");
  document.getElementById('storyTitle').value='';
  document.getElementById('storyContent').value='';
}

function openReader(s){
  currentStory = s;
  document.getElementById('rCat').innerText = s.cat;
  document.getElementById('rTitle').innerText = s.title;
  document.getElementById('rContent').innerText = s.content;
  document.getElementById('rContent').className = 'reader-content ' + (s.lang==='ur'?'urdu':'');
  document.getElementById('readerModal').classList.add('show');
  document.getElementById('ttsLabel').innerText = s.title;
}
function closeReader(){ 
  document.getElementById('readerModal').classList.remove('show'); 
  if(currentSpeech){ speechSynthesis.cancel(); }
}

document.querySelectorAll('.chip').forEach(chip=>{
  chip.onclick = ()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    renderStories(chip.dataset.cat);
  }
});

document.getElementById('readAloudBtn').onclick = document.getElementById('ttsBtn').onclick = function(){
  if(!currentStory){ showToast("Pehle koi story open karein"); return; }
  if(currentSpeech && speechSynthesis.speaking){
    speechSynthesis.cancel();
    this.innerText = '🔊';
    this.classList.remove('stop');
    return;
  }
  currentSpeech = new SpeechSynthesisUtterance(currentStory.content);
  currentSpeech.lang = currentStory.lang==='ur'?'ur-PK':'en-US';
  currentSpeech.rate = speechRate;
  this.innerText = '⏹️';
  this.classList.add('stop');
  currentSpeech.onend = ()=>{ this.innerText='🔊'; this.classList.remove('stop'); }
  speechSynthesis.speak(currentSpeech);
}

document.querySelectorAll('.speed-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    speechRate = parseFloat(btn.dataset.speed);
  }
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

renderStories();
</script>

</body>
  </html>
