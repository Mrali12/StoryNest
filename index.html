<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;600&family=Noto+Nastaliq+Urdu:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#050A18; --surface:#0F1A2F; --border:#1F2F4D; --paper:#E8F0FF; --gold:#4DA8DA; --maroon:#FF6B6B; --text:#E8F0FF; --text-dim:#8AA1C1; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ color:var(--text); font-family:'Inter',sans-serif; background:var(--ink); }
  header{position:sticky; top:0; background:rgba(5,10,24,.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:14px 20px;}
  .header-inner{max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:16px;}
  .logo{font-size:1.6rem; font-weight:700; color:var(--paper); cursor:pointer; font-family:'Lora',serif;}
  .logo span{color:var(--gold);}
  .header-actions{margin-left:auto; display:flex; gap:10px;}
  .btn{border:1px solid var(--gold); background:transparent; color:var(--gold); padding:8px 16px; border-radius:6px; cursor:pointer;}
  .btn-solid{background:var(--gold); color:var(--ink);}
  .overlay{position:fixed; inset:0; background:rgba(5,10,24,.9); z-index:100; display:none; align-items:center; justify-content:center;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); max-width:400px; width:90%; padding:30px; border-radius:12px; position:relative;}
  .modal-close{position:absolute; top:10px; right:14px; background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:.9rem; color:var(--text-dim); margin-bottom:6px;}
  .field input{width:100%; background:var(--ink); border:1px solid var(--border); color:var(--text); padding:10px 14px; border-radius:8px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">📖 Story<span>Nest</span></div>
    <div class="header-actions" id="headerActions">
      <button class="btn" onclick="openModal('loginModal')">Log In</button>
      <button class="btn btn-solid" onclick="openModal('signupModal')">Sign Up</button>
    </div>
  </div>
</header>

<div style="max-width:1200px; margin:50px auto; padding:20px; text-align:center;">
  <h1>Welcome to StoryNest</h1>
  <p style="color:var(--text-dim)">Login karke Admin Panel use karo</p>
</div>

<div class="overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('loginModal')">&times;</button>
    <h2>Log In</h2>
    <div class="field"><label>Email</label><input type="email" id="loginEmail"></div>
