<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest — English & Urdu Stories</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;600&family=Noto+Nastaliq+Urdu:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050A18;
    --surface:#0F1A2F;
    --border:#1F2F4D;
    --paper:#E8F0FF;
    --gold:#4DA8DA;
    --maroon:#FF6B6B;
    --text:#E8F0FF;
    --text-dim:#8AA1C1;
  }
  *{box-sizing:border-box; margin:0; padding:0; scroll-behavior:smooth;}
  body{ color:var(--text); font-family:'Inter',sans-serif; background:var(--ink); min-height:100vh; }
  h1,h2,h3{font-family:'Lora',serif;}
  header{position:sticky; top:0; z-index:40; background:rgba(5,10,24,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--border);}
 .header-inner{max-width:1200px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:16px;}
 .logo{font-size:1.6rem; font-weight:700; color:var(--paper); cursor:pointer;}
 .logo span{color:var(--gold);}
 .search-box{flex:1; max-width:400px; margin:0 20px;}
 .search-box input{width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px 14px; border-radius:8px; outline:none;}
 .header-actions{display:flex; align-items:center; gap:10px; margin-left:auto;}
 .btn{border:1px solid var(--gold); background:transparent; color:var(--gold); padding:8px 16px; font-size:.85rem; font-weight:600; border-radius:6px; cursor:pointer; transition:.3s;}
 .btn:hover{background:var(--gold); color:var(--ink); transform:translateY(-2px);}
 .btn-solid{background:var(--gold); color:var(--ink);}
 .hero-banner{max-width:1200px; margin:30px auto; padding:0 20px;}
 .banner-card{background:linear-gradient(90deg, rgba(5,10,24,0.9), transparent), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa') center/cover; border-radius:16px; padding:70px 40px; border:1px solid var(--border);}
 .banner-card h1{font-size:2.8rem; color:var(--paper);}
 .banner-card h1 em{color:var(--gold);}
 .section-title{max-width:1200px; margin:40px auto 15px; padding:0 20px; font-size:1.4rem; color:var(--paper);}
 .chip-row{max-width:1200px; margin:0 auto; padding:0 20px 10px; display:flex; gap:10px; flex-wrap:wrap;}
 .chip{border:1px solid var(--border); background:var(--surface); color:var(--text-dim); padding:8px 16px; border-radius:20px; cursor:pointer; transition:.3s;}
 .chip.active,.chip:hover{border-color:var(--gold); color:var(--gold);}
 .grid-wrap{max-width:1200px; margin:0 auto; padding:0 20px 60px;}
 .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:24px;}
 .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; cursor:pointer; overflow:hidden; transition:.3s;}
 .card:hover{transform:translateY(-6px); box-shadow:0 12px 24px rgba(77,168,218,.15); border-color:var(--gold);}
 .card-cover{aspect-ratio:3/4; background:#222;}
 .card-cover img{width:100%; height:100%; object-fit:cover;}
 .card-body{padding:16px;}
 .card-cat{color:var(--maroon); font-size:.72rem; font-weight:700;}
 .card-title{font-family:'Lora',serif; font-size:1.1rem; color:var(--paper); margin:6px 0; height:50px; overflow:hidden;}
 .card-meta{font-size:.76rem; color:var(--text-dim); display:flex; justify-content:space-between;}
 .overlay{position:fixed; inset:0; background:rgba(5,10,24,.9); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto;}
 .overlay.show{display:flex;}
 .reader{background:var(--ink); max-width:750px; width:100%; border-radius:16px; border:1px solid var(--border);}
 .reader-body{padding:30px 28px;}
 .reader-content{font-size:1.1rem; line-height:1.9; white-space:pre-wrap;}
 .reader-content.urdu{font-family:'Noto Nastaliq Urdu', serif; direction:rtl; font-size:1.4rem;}
 .listen-bar{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); padding:12px; margin-bottom:20px; border-radius:10px;}
 .listen-btn{width:42px; height:42px; border-radius:50%; background:var(--gold); color:var(--ink); border:none; font-size:1.1rem; cursor:pointer;}
 .modal{background:var(--surface); border:1px solid var(--border); max-width:440px; width:100%; padding:28px 24px; position:relative; border-radius:12px;}
 .modal-close{position:absolute; top:10px; right:14px; background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer;}
 .admin-wrap{max-width:800px; background:var(--surface); border:1px solid var(--border); padding:30px; border-radius:12px;}
 .field{margin-bottom:16px;}
 .field label{display:block; font-size:.85rem; color:var(--text-dim); margin-bottom:6px;}
 .field input,.field select,.field textarea{width:100%; background:var(--ink); border:1px solid var(--border); color:var(--text); padding:10px 14px; border-radius:8px; outline:none;}
 .game-card{background:var(--surface); padding:20px; text-align:center; border-radius:12px; border:1px solid var(--border); cursor:pointer; transition:.3s;}
 .game-card:hover{border-color:var(--gold); transform:translateY(-4px);}
 .tic-grid{display:grid; grid-template-columns:repeat(3, 100px); gap:8px; justify-content:center; margin:20px auto;}
 .tic-cell{width:100px; height:100px; background:var(--surface); border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:2.5rem; cursor:pointer; border-radius:8px; color:var(--gold);}
 .tic-cell:hover{background:#1F2F4D;}
  footer{border-top:1px solid var(--border); padding:40px 20px; text-align:center; color:var(--text-dim);}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" onclick="showSection('homeSection')">📖 Story<span>Nest</span></div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Search stories, authors..." onkeyup="searchStories()"></div>
    <div class="header-actions" id="headerActions">
      <button class="btn" onclick="showSection('gamesSection')">🎮 Games</button>
      <button class="btn" onclick="openModal('loginModal')">Log In</button>
      <button class="btn btn-solid" onclick="openModal('signupModal')">Sign Up</button>
    </div>
  </div>
</header>

<div id="homeSection">
  <div class="hero-banner">
    <div class="banner-card">
      <h1>Stories that stay with you —<br><em>English &amp; Urdu</em>, in one place.</h1>
      <p style="color:var(--text-dim); margin-top:10px;">Read. Listen. Feel. All for Free.</p>
    </div>
  </div>

  <h2 class="section-title">🔥 Trending Now</h2>
  <div class="grid-wrap"><div class="grid" id="trendingGrid"></div></div>

  <h2 class="section-title">🆕 Latest Stories</h2>
  <div class="chip-row" id="chipRow"></div>
  <div class="grid-wrap"><div class="grid" id="storyGrid"></div></div>
</div>

<section id="gamesSection" style="display:none; max-width:1200px; margin:0 auto; padding:40px 20px;">
  <div style="text-align:center;"><h1>🎮 Game Zone</h1><button class="btn" onclick="showSection('homeSection')">← Back to Stories</button></div>
  <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px; margin-top:30px;">
    <div class="game-card" onclick="openGame('snake')"><div style="font-size:60px;">🐍</div><h3>Snake</h3></div>
    <div class="game-card" onclick="openGame('tic')"><div style="font-size:60px;">❌</div><h3>Tic Tac Toe</h3></div>
  </div>
  <div id="gameContainer" style="margin-top:40px;"></div>
</section>

<div class="overlay" id="readerOverlay">
  <div class="reader">
    <div style="padding:16px 24px; border-bottom:1px solid var(--border);"><button class="btn" onclick="closeOverlay('readerOverlay')">← Back</button></div>
    <div class="reader-body" id="readerBody"></div>
  </div>
</div>

<footer><div>© <span id="year"></span> StoryNest. Made with ❤️ by Ali Raza</div></footer>

<div class="overlay" id="loginModal"><div class="modal"><button class="modal-close" onclick="closeOverlay('loginModal')">&times;</button><h2>Log In</h2><div class="field"><label>Email</label><input id="loginEmail"></div><div class="field"><label>Password</label><input type="password" id="loginPass"></div><button class="btn btn-solid" style="width:100%;" onclick="doLogin()">Log In</button></div></div>
<div class="overlay" id="signupModal"><div class="modal"><button class="modal-close" onclick="closeOverlay('signupModal')">&times;</button><h2>Sign Up</h2><div class="field"><label>Name</label><input id="signupName"></div><div class="field"><label>Email</label><input id="signupEmail"></div><div class="field"><label>Password</label><input type="password" id="signupPass"></div><button class="btn btn-solid" style="width:100%;" onclick="doSignup()">Sign Up</button></div></div>
<div class="overlay" id="adminGateModal"><div class="modal"><button class="modal-close" onclick="closeOverlay('adminGateModal')">&times;</button><h2>Admin Password</h2><div class="field"><input type="password" id="adminPassInput" placeholder="admin123"></div><button class="btn btn-solid" style="width:100%;" onclick="checkAdminPass()">Enter</button></div></div>
<div class="overlay" id="adminOverlay"><div class="admin-wrap"><div style="display:flex; justify-content:space-between;"><h2>Add Story</h2><button class="btn" onclick="closeOverlay('adminOverlay')">Close</button></div><div class="field"><label>Title</label><input id="fTitle"></div><div class="field"><label>Author</label><input id="fAuthor"></div><div class="field"><label>Language</label><div style="display:flex; gap:16px;"><label><input type="radio" name="fLang" value="en" checked> English</label><label><input type="radio" name="fLang" value="ur"> Urdu</label></div></div><div class="field"><label>Category</label><select id="fCategory"><option>Romance</option><option>Horror</option><option>Adventure</option><option>Comedy</option></select></div><div class="field"><label>Cover URL</label><input id="fCover"></div><div class="field"><label>Story</label><textarea id="fContent" style="min-height:200px;"></textarea></div><button class="btn btn-solid" style="width:100%;" onclick="addStory()">Publish</button><div id="adminList" style="margin-top:30px;"></div></div></div>

<script>
document.getElementById('year').innerText = new Date().getFullYear();
let stories = JSON.parse(localStorage.getItem('stories')) || [];
const ADMIN_EMAIL = "adibhatti12345@gmail.com";
let speech = new SpeechSynthesisUtterance();

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }
function showSection(s){ document.getElementById('homeSection').style.display = s==='homeSection'?'block':'none'; document.getElementById('gamesSection').style.display = s==='gamesSection'?'block':'none'; }

function doSignup(){ const u={name:signupName.value, email:signupEmail.value, pass:signupPass.value}; let users=JSON.parse(localStorage.getItem('users'))||[]; users.push(u); localStorage.setItem('users',JSON.stringify(users)); alert('Account ban gaya'); closeOverlay('signupModal'); }
function doLogin(){ const users=JSON.parse(localStorage.getItem('users'))||[]; const u=users.find(x=>x.email===loginEmail.value && x.pass===loginPass.value); if(u){ localStorage.setItem('currentUser',JSON.stringify(u)); updateHeader(); closeOverlay('loginModal'); } else alert('Galat email ya password'); }
function logout(){ localStorage.removeItem('currentUser'); location.reload(); }

function updateHeader(){
  const u = JSON.parse(localStorage.getItem('currentUser'));
  if(u){
    let adminBtn = '';
    if(u.email === ADMIN_EMAIL){
      adminBtn = `<button class="btn" onclick="openModal('adminGateModal')">➕ Add Story</button>`;
    }
    headerActions.innerHTML = `
      <button class="btn" onclick="showSection('gamesSection')">🎮 Games</button>
      ${adminBtn}
      <span style="color:var(--gold)">Hi, ${u.name}</span>
      <button class="btn" onclick="logout()">Logout</button>
    `;
  }
}

function checkAdminPass(){ if(adminPassInput.value==='admin123'){ closeOverlay('adminGateModal'); openModal('adminOverlay'); renderAdminList(); } else alert('Wrong Password'); }
function addStory(){ const s={id:Date.now(), title:fTitle.value, author:fAuthor.value, lang:document.querySelector('input[name="fLang"]:checked').value, cat:fCategory.value, content:fContent.value, cover:fCover.value, views:0, time:0}; stories.push(s); localStorage.setItem('stories',JSON.stringify(stories)); alert('Published'); renderStories(); renderTrending(); renderAdminList(); }
function renderAdminList(){ adminList.innerHTML=stories.map(s=>`<div style="padding:8px; border-bottom:1px solid var(--border)">${s.title} - Views:${s.views}</div>`).join(''); }

const cats=['All','Romance','Horror','Adventure','Comedy'];
function renderChips(){ chipRow.innerHTML=cats.map(c=>`<div class="chip" onclick="filterCat('${c}')">${c}</div>`).join(''); }
function filterCat(c){ document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); event.target.classList.add('active'); let f=c==='All'?stories:stories.filter(s=>s.cat===c); renderStories(f); }
function renderStories(arr=stories){ storyGrid.innerHTML=arr.map(s=>`<div class="card" onclick="openReader(${s.id})"><div class="card-cover"><img src="${s.cover||'https://via.placeholder.com/300x400'}"></div><div class="card-body"><div class="card-cat">${s.cat} • ${s.lang==='ur'?'Urdu':'English'}</div><div class="card-title">${s.title}</div><div class="card-meta"><span>By ${s.author}</span><span>👁 ${s.views}</span></div></div></div>`).join(''); }
function renderTrending(){ let top = [...stories].sort((a,b)=>b.views-a.views).slice(0,4); trendingGrid.innerHTML=top.map(s=>`<div class="card" onclick="openReader(${s.id})"><div class="card-cover"><img src="${s.cover||'https://via.placeholder.com/300x400'}"></div><div class="card-body"><div class="card-cat">${s.cat} • ${s.lang==='ur'?'Urdu':'English'}</div><div class="card-title">${s.title}</div><div class="card-meta"><span>By ${s.author}</span><span>👁 ${s.views}</span></div></div></div>`).join(''); }
function searchStories(){ let q = searchInput.value.toLowerCase(); let f = stories.filter(s=>s.title.toLowerCase().includes(q) || s.author.toLowerCase().includes(q)); renderStories(f); }

let currentStory=null; let startTime=0;
function openReader(id){ currentStory=stories.find(s=>s.id===id); currentStory.views++; localStorage.setItem('stories',JSON.stringify(stories)); startTime=Date.now(); readerBody.innerHTML=`<div class="listen-bar"><button class="listen-btn" onclick="toggleSpeech()">▶</button><span>Suniye Isay</span></div><h1 class="card-title">${currentStory.title}</h1><p style="color:var(--text-dim); margin-bottom:20px;">By ${currentStory.author}</p><div class="reader-content ${currentStory.lang==='ur'?'urdu':''}">${currentStory.content}</div>`; speech.text=currentStory.content; speech.lang=currentStory.lang==='ur'?'ur-PK':'en-US'; openModal('readerOverlay'); renderTrending(); }
readerOverlay.onclick=(e)=>{ if(e.target.id==='readerOverlay'){ let time=Math.floor((Date.now()-startTime)/1000); currentStory.time+=time; localStorage.setItem('stories',JSON.stringify(stories)); closeOverlay('readerOverlay'); } }
function toggleSpeech(){ if(speechSynthesis.speaking) speechSynthesis.cancel(); else speechSynthesis.speak(speech); }

// ===== GAMES CODE =====
let snake, food, dx, dy, score, gameInterval;
let ticBoard, ticTurn;

function openGame(g){
  if(g==='snake'){
    gameContainer.innerHTML=`<div style="text-align:center;">
      <h2 style="color:var(--gold); margin-bottom:10px;">🐍 Snake Game</h2>
      <p style="color:var(--text-dim); margin-bottom:15px;">Arrow Keys use karo | Score: <span id="score">0</span></p>
      <button class="btn btn-solid" onclick="startSnake()">START GAME</button>
      <div><canvas id="gameCanvas" width="400" height="400" style="background:#000; border:2px solid var(--gold); margin-top:20px; border-radius:8px;"></canvas></div>
    </div>`;
  }
  if(g==='tic'){
    ticBoard = ['','',''];
    ticTurn = 'X';
    gameContainer.innerHTML=`<div style="text-align:center;">
      <h2 style="color:var(--gold); margin-bottom:10px;">❌ Tic Tac Toe ⭕</h2>
      <p style="color:var(--text-dim); margin-bottom:15px;">Turn: <span id="ticTurn">X</span></p>
      <div class="tic-grid" id="ticGrid"></div>
      <button class="btn btn-solid" onclick="openGame('tic')">RESET</button>
    </div>`;
    renderTic();
  }
}

function startSnake(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const grid = 20;
  snake = [{x: 160, y: 200}];
  food = {x: 320, y: 200};
  dx = grid; dy = 0; score = 0;
  document.getElementById('score').innerText = 0;
  document.addEventListener('keydown', changeDirection);
  if(gameInterval) clearInterval(gameInterval);
  gameInterval = setInterval(()=>drawGame(ctx, grid), 100);
}

function changeDirection(e){
  if(e.key === 'ArrowUp' && dy === 0){ dx = 0; dy = -20; }
  if(e.key === 'ArrowDown' && dy === 0){ dx = 0; dy = 20; }
  if(e.key === 'ArrowLeft' && dx === 0){ dx = -20; dy = 0; }
  if(e.key === 'ArrowRight' && dx === 0){ dx = 20; dy = 0; }
}

function drawGame(ctx, grid){
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 400, 400);
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  if(head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400){ clearInterval(gameInterval); alert('Game Over! Score: ' + score); return; }
  for(let i=0; i<snake.length; i++){ if(head.x === snake[i].x && head.y === snake[i].y){ clearInterval(gameInterval); alert('Game Over! Score: ' + score); return; } }
  snake.unshift(head);
  if(head.x === food.x && head.y === food.y){ score += 10; document.getElementById('score').innerText = score; food = {x: Math.floor(Math.random()*20)*20, y: Math.floor(Math.random()*20)*20}; } else { snake.pop(); }
  ctx.fillStyle = 'red'; ctx.fillRect(food.x, food.y, grid, grid);
  ctx.fillStyle = '#4DA8DA'; snake.forEach(part => ctx.fillRect(part.x, part.y, grid, grid));
}

function renderTic(){
  ticGrid.innerHTML = ticBoard.map((v,i)=>`<div class="tic-cell" onclick="ticMove(${i})">${v}</div>`).join('');
  document.getElementById('ticTurn').innerText = ticTurn;
}

function ticMove(i){
  if(ticBoard[i]!== '' || checkTicWinner()) return;
  ticBoard[i] = ticTurn;
  ticTurn = ticTurn === 'X'? 'O' : 'X';
  renderTic();
  let winner = checkTicWinner();
  if(winner){ setTimeout(()=>alert(winner + ' Jeet gaya!'), 100); }
  else if(!ticBoard.includes('')){ setTimeout(()=>alert('Draw!'), 100); }
}

function checkTicWinner(){
  const win = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(let w of win){ if(ticBoard[w[0]] && ticBoard[w[0]]===ticBoard[w[1]] && ticBoard[w[1]]===ticBoard[w[2]]) return ticBoard[w[0]]; }
  return null;
}

window.onload=()=>{
  if(stories.length === 0){
    stories = [
      {id:1, title:"Mohabbat ki Dastan", author:"Ali Raza", lang:"ur", cat:"Romance", content:"Wo barish ki shaam thi...\n\nPehli baar usay college ke gate par dekha tha...\n\nDil ne kaha bas yehi hai.\n\nAaj wo meri biwi hai.\n\n- Ali Raza", cover:"https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600&h=800&fit=crop", views:152, time:0},
      {id:2, title:"The Haunted House", author:"John", lang:"en", cat:"Horror", content:"It was a dark and stormy night. I entered the old house...", cover:"https://images.unsplash.com/photo-1508697014387-db70aad34f4d?w=600&h=800&fit=crop", views:98, time:0}
    ];
    localStorage.setItem('stories',JSON.stringify(stories));
  }
  updateHeader();
  renderStories();
  renderTrending();
  renderChips();
}
</script>
</body>
 </html>
