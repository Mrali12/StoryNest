<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest – English & Urdu</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    background: #0f0a0a;
    color: #f5f1e8;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: #0f0a0a;
    border-bottom: 1px solid #2a2222;
  }

  .logo {
    font-size: 24px;
    font-weight: 700;
  }
  .logo span {
    color: #f4b400;
  }

  .nav-buttons {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn {
    padding: 8px 16px;
    border: 1px solid #f4b400;
    background: transparent;
    color: #f4b400;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn:hover {
    background: #f4b400;
    color: #0f0a0a;
  }

  .greeting {
    color: #f4b400;
    font-weight: 500;
  }

  /* Hero Section */
  .hero {
    text-align: center;
    padding: 60px 20px 40px;
  }

  .hero h1 {
    font-size: 38px;
    line-height: 1.3;
    font-weight: 600;
  }

  .hero h1 .highlight {
    color: #f4b400;
    font-style: italic;
    font-weight: 700;
  }

  /* Categories */
  .categories {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 0 20px 40px;
  }

  .category {
    padding: 10px 20px;
    background: #1e1818;
    border: 1px solid #333;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
  }

  .category.active {
    background: transparent;
    border: 1px solid #f4b400;
    color: #f4b400;
  }

  .category:hover {
    border-color: #f4b400;
  }

  /* Image Section */
  .banner-img {
    width: 90%;
    max-width: 800px;
    margin: 0 auto;
    display: block;
    border-radius: 12px;
  }

  @media (max-width: 600px) {
    .hero h1 { font-size: 26px; }
    .nav-buttons { gap: 6px; }
    .greeting { display: none; }
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">📖 Story<span>Nest</span></div>

      <button class="btn">🎮 Games</button>
      <div class="greeting">Hi, Ali raza</div>
      <button class="btn">Logout</button>
    </div>
  </div>
