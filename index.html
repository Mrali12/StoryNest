<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest — English & Urdu Stories</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;600&family=Noto+Nastaliq+Urdu:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#14110F; --surface:#1E1A16; --border:#332C24; --paper:#F2E8D5; --gold:#C9A227; --maroon:#8A3324; --text:#EDE6DA; --text-dim:#A99E8C; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ color:var(--text); font-family:'Inter',sans-serif; background:var(--ink); min-height:100vh; }
  h1,h2,h3{font-family:'Lora',serif;}
  header{position:sticky; top:0; z-index:40; background:rgba(20,17,15,.92); border-bottom:1px solid var(--border);}
 .header-inner{max-width:1100px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
 .logo{font-size:1.5rem; font-weight:700; color:var(--paper); cursor:pointer;}
 .logo span{color:var(--gold);}
 .header-actions{display:flex; align-items:center; gap:10px; margin-left:auto;}
 .btn{border:1px solid var(--gold); background:transparent; color:var(--gold); padding:8px 16px; font-size:.85rem; font-weight:600; border-radius:2px; cursor:pointer;}
 .btn:hover{background:var(--gold); color:var(--ink);}
 .btn-solid{background:var(--gold); color:var(--ink);}
 .hero{max-width:1100px; margin:0 auto; padding:56px 18px 28px; text-align:center;}
 .hero h1{font-size:2.4rem; color:var(--paper);}
 .hero h1 em{color:var(--gold);}
 .chip-row{max-width:1100px; margin:0 auto; padding:0 18px 26px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
 .chip{border:1px solid var(--border); background:var(--surface); color:var(--text-dim); padding:7px 15px; border-radius:20px; cursor:pointer;}
 .chip.active{border-color:var(--gold); color:var(--gold);}
 .grid-wrap{max-width:1100px; margin:0 auto; padding:0 18px 60px;}
 .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:22px;}
 .card{background:var(--surface); border:1px solid var(--border); cursor:pointer;}
 .card-cover{aspect-ratio:3/4; background:#222;}
 .card-cover img{width:100%; height:100%; object-fit:cover;}
 .card-body{padding:14px;}
 .card-cat{color:var(--maroon); font-size:.72rem; font-weight:700;}
 .card-title{font-family:'Lora',serif; font-size:1.08rem; color:var(--paper); margin:5px 0;}
 .card-meta{font-size:.76rem; color:var(--text-dim);}
 .overlay{position:fixed; inset:0; background:rgba(10,8,6,.72); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto;}
 .overlay.show{display:flex;}
 .modal{background:var(--surface); border:1px solid var(--border); max-width:440px; width:100%; padding:28px 24px; position:relative;}
 .admin-wrap{max-width:760px; background:var(--surface); border:1px solid var(--border); padding:26px 24px;}
 .field{margin-bottom:14px;}
 .field label{display:block; font-size:.82rem; color:var(--text-dim); margin-bottom:5px;}
 .field input, .field select, .field textarea{width:100%; background:var(--ink); border:1px solid var(--border); color:var(--text); padding:9px 12px;}
 .modal-close{position:absolute; top:10px; right:14px; background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer;}
 .reader{background:var(--ink); max-width:720px; width:100%;}
 .reader-body{padding:26px 24px;}
 .reader-content{font-size:1.05rem; line-height:1.85; white-space:pre-wrap;}
 .reader-content.urdu{font-family:'Noto Nastaliq Urdu', serif; direction:rtl; font-size:1.35rem;}
 .listen-bar{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); padding:12px; margin-bottom:20px;}
 .listen-btn{width:38px; height:38px; border-radius:50%; background:var(--gold); color:var(--ink); border:none; font-size:1rem;}
  footer{border-top:1px solid var(--border); padding:34px 18px; text-align:center; color:var(--text-dim);}
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" onclick="showSection('homeSection')">📖 Story<span>Nest</span></div>
    <div class="header-actions" id="headerActions">
      <button class="btn" onclick="showSection('gamesSection')">🎮 Games</button>
      <button class="btn" onclick="openModal('loginModal')">Log In</button>
      <button class="btn btn-solid" onclick="openModal('signupModal')">Sign Up</button>
    </div>
  </div>
</header>

<!-- HOME -->
<div id="homeSection">
  <section class="hero">
    <h1>Stories that stay with you —<br><em>English &amp; Urdu</em>, in one place.</h1>
  </section>
  <div class="chip-row" id="chipRow"></div>
  <div class="grid-wrap">
    <div class="grid" id="storyGrid"></div>
  </div>
</div>

<!-- GAMES -->
<section id="gamesSection" style="display:none; max-width:1100px; margin:0 auto; padding:40px 18px;">
  <div style="text-align:center;"><h1>🎮 Game Zone</h1><button class="btn" onclick="showSection('homeSection')">← Back</button></div>
  <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:20px; margin-top:30px;">
    <div onclick="openGame('snake')" style="background:var(--surface); padding:20px; text-align:center; cursor:pointer;"><div style="font-size:60px;">🐍</div><h3>Snake</h3></div>
    <div onclick="alert('Coming Soon')" style="background:var(--surface); padding:20px; text-align:center;"><div style="font-size:60px;">⭕</div><h3>Tic Tac Toe</h3></div>
  </div>
  <div id="gameContainer" style="margin-top:40px;"></div>
</section>

<!-- READER -->
<div class="overlay" id="readerOverlay">
  <div class="reader">
    <div style="padding:14px 20px; border-bottom:1px solid var(--border);"><button class="btn" onclick="closeOverlay('readerOverlay')">← Back</button></div>
    <div class="reader-body" id="readerBody"></div>
  </div>
</div>

<footer>
  <div style="display:flex; gap:18px; justify-content:center;">
    <a onclick="openModal('adminGateModal')">Admin</a>
  </div>
  <div>© <span id="year"></span> StoryNest</div>
</footer>

<!-- MODALS -->
<div class="overlay" id="loginModal"><div class="modal"><button class="modal-close" onclick="closeOverlay('loginModal')">&times;</button><h2>Log In</h2><div class="field"><label>Email</label><input id="loginEmail"></div><div class="field"><label>Password</label><input type="password" id="loginPass"></div><button class="btn btn-solid" style="width:100%;" onclick="doLogin()">Log In</button></div></div>
<div class="overlay" id="signupModal"><div class="modal"><button class="modal-close" onclick="closeOverlay('signupModal')">&times;</button><h2>Sign Up</h2><div class="field"><label>Name</label><input id="signupName"></div><div class="field"><label>Email</label><input id="signupEmail"></div><div class="field"><label>Password</label><input type="password" id="signupPass"></div><button class="btn btn-solid" style="width:100%;" onclick="doSignup()">Sign Up</button></div></div>
<div class="overlay" id="adminGateModal"><div class="modal"><button class="modal-close" onclick="closeOverlay('adminGateModal')">&times;</button><h2>Admin Password</h2><div class="field"><input type="password" id="adminPassInput" placeholder="admin123"></div><button class="btn btn-solid" style="width:100%;" onclick="checkAdminPass()">Enter</button></div></div>
<div class="overlay" id="adminOverlay"><div class="admin-wrap"><div style="display:flex; justify-content:space-between;"><h2>Add Story</h2><button class="btn" onclick="closeOverlay('adminOverlay')">Close</button></div><div class="field"><label>Title</label><input id="fTitle"></div><div class="field"><label>Author</label><input id="fAuthor"></div><div class="field"><label>Language</label><div style="display:flex; gap:16px;"><label><input type="radio" name="fLang" value="en" checked> English</label><label><input type="radio" name="fLang" value="ur"> Urdu</label></div></div><div class="field"><label>Category</label><select id="fCategory"><option>Romance</option><option>Horror</option><option>Adventure</option><option>Comedy</option></select></div><div class="field"><label>Cover URL</label><input id="fCover"></div><div class="field"><label>Story</label><textarea id="fContent" style="min-height:200px;"></textarea></div><button class="btn btn-solid" style="width:100%;" onclick="addStory()">Publish</button><div id="adminList" style="margin-top:30px;"></div></div></div>

<script>
document.getElementById('year').innerText = new Date().getFullYear();
let stories = JSON.parse(localStorage.getItem('stories')) || [];
let speech = new SpeechSynthesisUtterance();

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }
function showSection(s){ document.getElementById('homeSection').style.display = s==='homeSection'?'block':'none'; document.getElementById('gamesSection').style.display = s==='gamesSection'?'block':'none'; }

// LOGIN SYSTEM
function doSignup(){ const u={name:signupName.value, email:signupEmail.value, pass:signupPass.value}; let users=JSON.parse(localStorage.getItem('users'))||[]; users.push(u); localStorage.setItem('users',JSON.stringify(users)); alert('Account ban gaya'); closeOverlay('signupModal'); }
function doLogin(){ const users=JSON.parse(localStorage.getItem('users'))||[]; const u=users.find(x=>x.email===loginEmail.value && x.pass===loginPass.value); if(u){ localStorage.setItem('currentUser',JSON.stringify(u)); updateHeader(); closeOverlay('loginModal'); } else alert('Galat'); }
function logout(){ localStorage.removeItem('currentUser'); location.reload(); }
function updateHeader(){ const u=JSON.parse(localStorage.getItem('currentUser')); if(u){ headerActions.innerHTML=`<button class="btn" onclick="showSection('gamesSection')">🎮 Games</button><span style="color:var(--gold)">Hi, ${u.name}</span><button class="btn" onclick="logout()">Logout</button>`; } }
window.onload=()=>{ updateHeader(); renderStories(); renderChips(); }

// ADMIN
function checkAdminPass(){ if(adminPassInput.value==='admin123'){ closeOverlay('adminGateModal'); openModal('adminOverlay'); renderAdminList(); } else alert('Wrong'); }
function addStory(){ const s={id:Date.now(), title:fTitle.value, author:fAuthor.value, lang:document.querySelector('input[name="fLang"]:checked').value, cat:fCategory.value, content:fContent.value, cover:fCover.value, views:0, time:0}; stories.push(s); localStorage.setItem('stories',JSON.stringify(stories)); alert('Published'); renderStories(); renderAdminList(); }
function renderAdminList(){ adminList.innerHTML=stories.map(s=>`<div>${s.title} - Views:${s.views} - Time:${s.time}s</div>`).join(''); }

// STORIES + CATEGORIES
const cats=['All','Romance','Horror','Adventure','Comedy'];
function renderChips(){ chipRow.innerHTML=cats.map(c=>`<div class="chip" onclick="filterCat('${c}')">${c}</div>`).join(''); }
function filterCat(c){ document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); event.target.classList.add('active'); let f=c==='All'?stories:stories.filter(s=>s.cat===c); renderStories(f); }
function renderStories(arr=stories){ storyGrid.innerHTML=arr.map(s=>`<div class="card" onclick="openReader(${s.id})"><div class="card-cover"><img src="${s.cover||'https://via.placeholder.com/300x400'}"></div><div class="card-body"><div class="card-cat">${s.cat} - ${s.lang==='ur'?'Urdu':'English'}</div><div class="card-title">${s.title}</div><div class="card-meta">Views: ${s.views}</div></div></div>`).join(''); }

// READER + TTS + VIEWS
let currentStory=null; let startTime=0;
function openReader(id){ currentStory=stories.find(s=>s.id===id); currentStory.views++; localStorage.setItem('stories',JSON.stringify(stories)); startTime=Date.now(); readerBody.innerHTML=`<div class="listen-bar"><button class="listen-btn" onclick="toggleSpeech()">▶</button><span>Listen</span></div><h1 class="card-title">${currentStory.title}</h1><div class="reader-content ${currentStory.lang==='ur'?'urdu':''}">${currentStory.content}</div>`; speech.text=currentStory.content; speech.lang=currentStory.lang==='ur'?'ur-PK':'en-US'; openModal('readerOverlay'); }
readerOverlay.onclick=(e)=>{ if(e.target.id==='readerOverlay'){ let time=Math.floor((Date.now()-startTime)/1000); currentStory.time+=time; localStorage.setItem('stories',JSON.stringify(stories)); closeOverlay('readerOverlay'); } }
function toggleSpeech(){ if(speechSynthesis.speaking) speechSynthesis.cancel(); else speechSynthesis.speak(speech); }

// GAME
function openGame(g){ if(g==='snake'){ gameContainer.innerHTML=`<div style="text-align:center;"><button class="btn btn-solid" onclick="startSnake()">PLAY SNAKE</button><canvas id="c" width="400" height="400" style="background:#111; border:2px solid var(--gold); margin-top:20px;"></canvas></div>`; } }
function startSnake(){ alert('Snake logic yahan add hoga. Pehle stories test karo'); }
</script>
</body>
</html>
