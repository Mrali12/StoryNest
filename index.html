<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest — English &amp; Urdu Stories</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;600&family=Noto+Nastaliq+Urdu:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#14110F; --surface:#1E1A16; --border:#332C24; --paper:#F2E8D5; --gold:#C9A227; --maroon:#8A3324; --text:#EDE6DA; --text-dim:#A99E8C; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ color:var(--text); font-family:'Inter',sans-serif; background:var(--ink); min-height:100vh; }
  h1,h2,h3{font-family:'Lora',serif;}
  header{position:sticky; top:0; z-index:40; background:rgba(20,17,15,.92); border-bottom:1px solid var(--border);}
 .header-inner{max-width:1100px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
 .logo{font-size:1.5rem; font-weight:700; color:var(--paper); cursor:pointer;}
 .logo span{color:var(--gold);}
 .header-actions{display:flex; align-items:center; gap:10px; margin-left:auto;}
 .btn{border:1px solid var(--gold); background:transparent; color:var(--gold); padding:8px 16px; font-size:.85rem; font-weight:600; border-radius:2px; cursor:pointer;}
 .btn:hover{background:var(--gold); color:var(--ink);}
 .btn-solid{background:var(--gold); color:var(--ink);}
 .hero{max-width:1100px; margin:0 auto; padding:56px 18px 28px; text-align:center;}
 .hero h1{font-size:2.4rem; color:var(--paper);}
 .hero h1 em{color:var(--gold); font-style:normal;}
 .overlay{position:fixed; inset:0; background:rgba(10,8,6,.72); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:30px 14px;}
 .overlay.show{display:flex;}
 .modal{background:var(--surface); border:1px solid var(--border); max-width:440px; width:100%; padding:28px 24px; margin-top:20px; position:relative;}
 .modal h2{font-family:'Lora',serif; color:var(--paper); margin-bottom:18px;}
 .field{margin-bottom:14px;}
 .field label{display:block; font-size:.82rem; color:var(--text-dim); margin-bottom:5px;}
 .field input{width:100%; background:var(--ink); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:2px;}
 .modal-close{position:absolute; top:10px; right:14px; background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer;}
 .switch-line{text-align:center; margin-top:14px; font-size:.85rem; color:var(--text-dim);}
 .switch-line a{color:var(--gold); font-weight:600; cursor:pointer;}
  footer{border-top:1px solid var(--border); padding:34px 18px; text-align:center; color:var(--text-dim);}
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" onclick="showSection('homeSection')">📖 Story<span>Nest</span></div>
    <div class="header-actions" id="headerActions">
      <button class="btn" onclick="showSection('gamesSection')">🎮 Games</button>
      <button class="btn" onclick="openModal('loginModal')">Log In</button>
      <button class="btn btn-solid" onclick="openModal('signupModal')">Sign Up</button>
    </div>
  </div>
</header>

<!-- HOME -->
<div id="homeSection">
  <section class="hero">
    <h1>Stories that stay with you —<br><em>English &amp; Urdu</em>, in one place.</h1>
  </section>
</div>

<!-- GAMES -->
<section id="gamesSection" style="display:none; max-width:1100px; margin:0 auto; padding:40px 18px;">
  <div style="text-align:center; margin-bottom:30px;">
    <h1 style="font-size:2.2rem; color:var(--paper);">🎮 Game Zone</h1>
    <button class="btn" onclick="showSection('homeSection')" style="margin-top:12px;">← Back to Stories</button>
  </div>
  <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:20px;">
    <div onclick="openGame('snake')" style="background:var(--surface); border:1px solid var(--border); padding:20px; text-align:center; cursor:pointer;">
      <div style="font-size:60px;">🐍</div><h3>Snake</h3>
    </div>
    <div onclick="openGame('tictac')" style="background:var(--surface); border:1px solid var(--border); padding:20px; text-align:center; cursor:pointer;">
      <div style="font-size:60px;">⭕</div><h3>Tic Tac Toe</h3>
    </div>
    <div onclick="openGame('memory')" style="background:var(--surface); border:1px solid var(--border); padding:20px; text-align:center; cursor:pointer;">
      <div style="font-size:60px;">🧠</div><h3>Memory</h3>
    </div>
    <div onclick="openGame('flappy')" style="background:var(--surface); border:1px solid var(--border); padding:20px; text-align:center; cursor:pointer;">
      <div style="font-size:60px;">🐦</div><h3>Flappy</h3>
    </div>
    <div onclick="openGame('2048')" style="background:var(--surface); border:1px solid var(--border); padding:20px; text-align:center; cursor:pointer;">
      <div style="font-size:60px;">🔢</div><h3>2048</h3>
    </div>
  </div>
  <div id="gameContainer" style="margin-top:40px;"></div>
</section>

<footer>© <span id="year"></span> StoryNest</footer>

<!-- Login modal -->
<div class="overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeOverlay('loginModal')">&times;</button>
    <h2>Log In</h2>
    <div class="field"><label>Email</label><input type="email" id="loginEmail"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass"></div>
    <button class="btn btn-solid" style="width:100%;" onclick="doLogin()">Log In</button>
    <div class="switch-line">New here? <a onclick="closeOverlay('loginModal'); openModal('signupModal')">Sign up</a></div>
  </div>
</div>

<!-- Signup modal -->
<div class="overlay" id="signupModal">
  <div class="modal">
    <button class="modal-close" onclick="closeOverlay('signupModal')">&times;</button>
    <h2>Create Account</h2>
    <div class="field"><label>Name</label><input type="text" id="signupName"></div>
    <div class="field"><label>Email</label><input type="email" id="signupEmail"></div>
    <div class="field"><label>Password</label><input type="password" id="signupPass"></div>
    <button class="btn btn-solid" style="width:100%;" onclick="doSignup()">Sign Up</button>
    <div class="switch-line">Already have an account? <a onclick="closeOverlay('signupModal'); openModal('loginModal')">Log in</a></div>
  </div>
</div>

<script>
document.getElementById('year').innerText = new Date().getFullYear();

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

function showSection(sectionId){
  document.getElementById('homeSection').style.display = sectionId==='homeSection'? 'block' : 'none';
  document.getElementById('gamesSection').style.display = sectionId==='gamesSection'? 'block' : 'none';
  window.scrollTo(0,0);
}

// ===== LOGIN / SIGNUP SYSTEM =====
function doSignup(){
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const pass = document.getElementById('signupPass').value;

  if(!name ||!email ||!pass){ alert('Sab fields bharo'); return; }

  let users = JSON.parse(localStorage.getItem('users')) || [];
  if(users.find(u => u.email === email)){ alert('Ye email pehle se hai'); return; }

  users.push({name, email, pass});
  localStorage.setItem('users', JSON.stringify(users));
  alert('Account ban gaya! Ab Login karo');
  closeOverlay('signupModal');
}

function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const users = JSON.parse(localStorage.getItem('users')) || [];
  const user = users.find(u => u.email === email && u.pass === pass);

  if(user){
    localStorage.setItem('currentUser', JSON.stringify(user));
    alert('Welcome ' + user.name);
    closeOverlay('loginModal');
    updateHeader();
  } else {
    alert('Email ya Password galat hai');
  }
}

function logout(){
  localStorage.removeItem('currentUser');
  updateHeader();
  location.reload();
}

function updateHeader(){
  const user = JSON.parse(localStorage.getItem('currentUser'));
  const header = document.getElementById('headerActions');
  if(user){
    header.innerHTML = `
      <button class="btn" onclick="showSection('gamesSection')">🎮 Games</button>
      <div style="color:var(--gold)">Hi, ${user.name}</div>
      <button class="btn" onclick="logout()">Logout</button>
    `;
  }
}
window.onload = updateHeader;

// ===== GAME LOGIC =====
let currentGameInterval = null;
function openGame(game){
  const container = document.getElementById('gameContainer');
  clearInterval(currentGameInterval);

  if(game === 'snake'){
    container.innerHTML = `
      <div style="text-align:center;">
        <div id="snakeStart">
          <div style="font-size:80px; animation:bounce 1s infinite;">🐍</div>
          <h2 style="color:var(--gold);">Snake Game</h2>
          <button class="btn btn-solid" onclick="startSnakeGame()">PLAY NOW</button>
        </div>
        <div id="snakeGameArea" style="display:none;">
          <div id="score" style="color:var(--gold); font-size:22px; margin:10px;">Score: 0</div>
          <canvas id="snakeCanvas" width="400" height="400" style="background:#1a1a1a; border:3px solid var(--gold); max-width:90%;"></canvas>
          <div style="display:grid; grid-template-columns:60px 60px 60px; gap:10px; justify-content:center; margin-top:15px;">
            <button class="btn" id="upBtn" style="grid-column:2;">↑</button>
            <button class="btn" id="leftBtn">←</button>
            <button class="btn" id="downBtn" style="grid-column:2;">↓</button>
            <button class="btn" id="rightBtn" style="grid-column:3;">→</button>
          </div>
        </div>
      </div>
    `;
  } else {
    container.innerHTML = `<div style="text-align:center; padding:60px;"><h2>Coming Soon!</h2></div>`;
  }
}

function startSnakeGame(){
  document.getElementById('snakeStart').style.display='none';
  document.getElementById('snakeGameArea').style.display='block';
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const box = 20;
  let snake = [{x: 10, y: 10}];
  let food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
  let dir = 'RIGHT'; let score = 0;

  function setDir(newDir) {
    if(newDir === 'LEFT' && dir!== 'RIGHT') dir = 'LEFT';
    if(newDir === 'RIGHT' && dir!== 'LEFT') dir = 'RIGHT';
    if(newDir === 'UP' && dir!== 'DOWN') dir = 'UP';
    if(newDir === 'DOWN' && dir!== 'UP') dir = 'DOWN';
  }
  document.getElementById('upBtn').onclick = () => setDir('UP');
  document.getElementById('downBtn').onclick = () => setDir('DOWN');
  document.getElementById('leftBtn').onclick = () => setDir('LEFT');
  document.getElementById('rightBtn').onclick = () => setDir('RIGHT');

  currentGameInterval = setInterval(draw, 130);
  function draw() {
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, 400, 400);
    let head = {x: snake[0].x, y: snake[0].y};
    if(dir === 'LEFT') head.x--; if(dir === 'RIGHT') head.x++;
    if(dir === 'UP') head.y--; if(dir === 'DOWN') head.y++;
    if(head.x < 0) head.x = 19; if(head.x >= 20) head.x = 0;
    if(head.y < 0) head.y = 19; if(head.y >= 20) head.y = 0;
    if(snake.some(s => s.x === head.x && s.y === head.y)) { clearInterval(currentGameInterval); alert('Game Over! Score: ' + score); return; }
    snake.unshift(head);
    if(head.x === food.x && head.y === food.y) { score += 10; document.getElementById('score').innerText = 'Score: ' + score; food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)}; } else { snake.pop(); }
    ctx.fillStyle = 'var(--gold)'; snake.forEach((s) => ctx.fillRect(s.x*box, s.y*box, box-2, box-2));
    ctx.fillStyle = 'var(--maroon)'; ctx.fillRect(food.x*box, food.y*box, box-2, box-2);
  }
}
</script>
</body>
</html>
