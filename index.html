<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest — English & Urdu Stories & Games</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14110F; --surface:#1E1A16; --border:#332C24; --gold:#C9A227; --maroon:#8A3324; --text:#EDE6DA; --text-dim:#A99E8C;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{color:var(--text); font-family:'Inter',sans-serif; background:var(--ink); min-height:100vh; display:flex; flex-direction:column;}
.urdu{font-family:'Noto Nastaliq Urdu', serif; direction:rtl; line-height:2.1;}
  header{position:sticky; top:0; background:rgba(20,17,15,.92); border-bottom:1px solid var(--border); padding:14px 18px; display:flex; justify-content:space-between; z-index:50;}
.logo{font-size:1.5rem; font-weight:700; color:var(--text);}.logo span{color:var(--gold);}
.btn{border:1px solid var(--gold); background:transparent; color:var(--gold); padding:8px 16px; border-radius:8px; cursor:pointer;}
.btn-solid{background:var(--gold); color:var(--ink); border:none;}
.hero{text-align:center; padding:50px 18px;}.hero h1{font-family:'Lora',serif; font-size:2.2rem;}.hero h1 em{color:var(--gold);}
.section-title{max-width:1100px; margin:0 auto; padding:40px 18px 10px; font-family:'Lora',serif; font-size:1.6rem;}.section-title span{color:var(--gold);}
.chip-row{display:flex; gap:10px; justify-content:center; padding:0 18px 20px; flex-wrap:wrap;}
.chip{border:1px solid var(--border); background:var(--surface); color:var(--text-dim); padding:7px 15px; border-radius:20px; cursor:pointer;}
.chip.active{border-color:var(--gold); color:var(--gold);}
.grid{max-width:1100px; margin:0 auto; padding:0 18px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:22px; flex:1;}
.card{background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--maroon); border-radius:14px; overflow:hidden; cursor:pointer; transition:.2s;}
.card:hover{border-top-color:var(--gold); transform:translateY(-3px);}
.card-cover{aspect-ratio:3/4; width:100%; object-fit:cover;}
.card-body{padding:14px;}
.card-cat{color:var(--maroon); font-size:.72rem; font-weight:700; text-transform:uppercase;}
.card-title{font-family:'Lora',serif; font-size:1.1rem; color:var(--gold); margin:5px 0;}
.game-card{aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;}
.game-icon{font-size:3rem; margin-bottom:10px;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:100; display:none; align-items:center; justify-content:center;}
.overlay.show{display:flex;}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; max-width:500px; width:90%; padding:24px; position:relative;}
.modal-close{position:absolute; top:10px; right:14px; background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer;}
.field{margin-bottom:14px;}.field label{display:block; font-size:.8rem; color:var(--text-dim); margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%; background:var(--ink); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:8px;}
.field input[type="file"]{padding:6px; cursor:pointer;}
.img-preview{width:100%; max-height:150px; object-fit:cover; border-radius:8px; margin-top:8px; display:none; border:1px solid var(--border);}
.reader-body{max-width:700px; background:var(--surface); padding:24px; border-radius:14px; max-height:90vh; overflow-y:auto;}
.game-body{max-width:500px; background:var(--surface); padding:24px; border-radius:14px; text-align:center;}
.game-score{font-size:1.2rem; color:var(--gold); margin-bottom:15px;}
#toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--ink); padding:11px 22px; border-radius:8px; font-weight:600; opacity:0; transition:.25s; z-index:200;}
#toast.show{opacity:1;}
footer{border-top:1px solid var(--border); background:var(--surface); padding:40px 18px 20px; margin-top:60px;}
.footer-inner{max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:30px;}
.footer-col h3{font-family:'Lora',serif; color:var(--gold); font-size:1.1rem; margin-bottom:12px;}
.footer-bottom{text-align:center; padding-top:20px; margin-top:20px; border-top:1px solid var(--border); color:var(--text-dim); font-size:.8rem;}
.memory-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:15px 0;}
.memory-card{aspect-ratio:1; background:var(--ink); border:2px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:2rem; cursor:pointer;}
.memory-card.flipped{background:var(--gold); color:var(--ink);}
.snake-canvas{border:2px solid var(--gold); background:var(--ink); margin:10px 0;}
.tic-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:300px; margin:15px auto;}
.tic-cell{aspect-ratio:1; background:var(--ink); border:2px solid var(--border); font-size:3rem; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--gold);}
</style>
</head>
<body>

<header>
  <div class="logo">📖Story<span>Nest</span></div>
  <button class="btn" onclick="openAdmin()">+ Add Story</button>
</header>

<div class="hero"><h1>Stories that stay with you — <em>English & Urdu</em></h1></div>

<h2 class="section-title">📚 <span>Stories</span></h2>
<div class="chip-row" id="categoryChips">
  <button class="chip active" data-cat="All">All</button>
  <button class="chip" data-cat="Romance">Romance</button>
  <button class="chip" data-cat="Horror">Horror</button>
  <button class="chip" data-cat="Adventure">Adventure</button>
  <button class="chip" data-cat="Comedy">Comedy</button>
</div>
<div class="grid" id="storyGrid"><div style="text-align:center; grid-column:1/-1;">Loading Stories...</div></div>

<h2 class="section-title">🎮 <span>Mini Games</span></h2>
<div class="grid" id="gamesGrid"></div>

<footer>
  <div class="footer-inner">
    <div class="footer-col"><h3>📖 StoryNest</h3><p>Read and Listen English & Urdu stories</p></div>
    <div class="footer-col"><h3>Categories</h3></div>
    <div class="footer-col"><h3>Quick Links</h3></div>
    <div class="footer-col"><h3>Follow Us</h3></div>
  </div>
  <div class="footer-bottom">© 2026 StoryNest. Made with ❤️ in Pakistan</div>
</footer>

<!-- ADMIN PASSWORD MODAL -->
<div id="passwordModal" class="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closePassModal()">&times;</button>
    <h2 style="font-family:Lora; margin-bottom:15px;">Admin Login</h2>
    <div class="field"><label>Enter Password</label><input type="password" id="adminPass" placeholder="Killer9211" onkeypress="if(event.key==='Enter') checkPassword()"></div>
    <button class="btn-solid" style="width:100%" onclick="checkPassword()">Login</button>
    <p id="passError" style="color:var(--maroon); margin-top:10px; display:none;">Wrong Password!</p>
  </div>
</div>

<!-- ADMIN MODAL -->
<div id="adminModal" class="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeAdmin()">&times;</button>
    <h2 style="font-family:Lora; margin-bottom:15px;">Add New Story</h2>
    <div class="field"><label>Story Title</label><input type="text" id="storyTitle"></div>
    <div class="field">
      <label>Cover Image</label>
      <input type="file" id="storyImageFile" accept="image/*">
      <img id="imgPreview" class="img-preview">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="storyCategory"><option>Romance</option><option>Horror</option><option>Adventure</option><option>Comedy</option></select>
    </div>
    <div class="field">
      <label>Language</label>
      <select id="storyLang"><option value="en">English</option><option value="ur">Urdu</option></select>
    </div>
    <div class="field"><label>Story Content</label><textarea id="storyContent" rows="6"></textarea></div>
    <button class="btn-solid" style="width:100%" id="publishBtn" onclick="addStory()">Publish Story</button>
  </div>
</div>

<!-- READER MODAL -->
<div id="readerModal" class="overlay">
  <div class="reader-body">
    <button class="btn" onclick="closeReader()" style="margin-bottom:15px;">← Back</button>
    <img id="rImage" class="card-cover" style="margin-bottom:15px; border-radius:8px;">
    <div class="card-cat" id="rCat"></div>
    <h1 class="card-title" id="rTitle" style="font-size:1.6rem;"></h1>
    <div id="rContent" style="line-height:1.8; margin:15px 0;"></div>
    <button class="btn-solid" id="readAloudBtn">🔊 Read Aloud</button>
  </div>
</div>

<!-- GAME MODAL -->
<div id="gameModal" class="overlay">
  <div class="game-body" id="gameContent"></div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let currentStory = null;
let currentSpeech = null;
let selectedFile = null;
const ADMIN_PASSWORD = "Killer9211";
const DEFAULT_IMG = "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400";

const games = [
  {id:1, icon:"🧠", title:"Memory Match", desc:"Find matching pairs"},
  {id:2, icon:"🎯", title:"Number Guess", desc:"Guess 1-100 number"},
  {id:3, icon:"✂️", title:"Rock Paper Scissors", desc:"Play vs Computer"},
  {id:4, icon:"🔤", title:"Word Scramble", desc:"Unscramble the word"},
  {id:5, icon:"⭕", title:"Tic Tac Toe", desc:"X vs O"},
  {id:6, icon:"🐍", title:"Snake Game", desc:"Classic snake"}
];

// FIX 1: DOM load hone ke baad games render karo
document.addEventListener('DOMContentLoaded', function(){
  renderGames();
});

document.getElementById('storyImageFile').onchange = function(e){
  selectedFile = e.target.files[0];
  if(selectedFile){
    const reader = new FileReader();
    reader.onload = function(e){
      document.getElementById('imgPreview').src = e.target.result;
      document.getElementById('imgPreview').style.display = 'block';
    }
    reader.readAsDataURL(selectedFile);
  }
}

function renderGames(){
  const grid = document.getElementById('gamesGrid');
  if(!grid) return; // FIX 2: agar grid na mile to error na do
  grid.innerHTML = '';
  games.forEach(g=>{
    const card = document.createElement('div');
    card.className = 'card game-card';
    card.innerHTML = `<div class="game-icon">${g.icon}</div><div class="card-title">${g.title}</div><div style="color:var(--text-dim); font-size:.85rem;">${g.desc}</div>`;
    card.onclick = ()=>playGame(g.id); // YE CLICK AB KAAM KAREGA
    grid.appendChild(card);
  });
}

// PASSWORD CHECK
function openAdmin(){ document.getElementById('passwordModal').classList.add('show'); }
function closePassModal(){ document.getElementById('passwordModal').classList.remove('show'); document.getElementById('adminPass').value=''; document.getElementById('passError').style.display='none'; }
function checkPassword(){
  const pass = document.getElementById('adminPass').value;
  if(pass === ADMIN_PASSWORD){
    closePassModal();
    document.getElementById('adminModal').classList.add('show');
  } else {
    document.getElementById('passError').style.display='block';
  }
}
function closeAdmin(){ document.getElementById('adminModal').classList.remove('show'); selectedFile=null; document.getElementById('imgPreview').style.display='none'; document.getElementById('storyImageFile').value=''; }
