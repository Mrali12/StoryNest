<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest – English & Urdu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0D; --card: #161616; --yellow: #FFC107; 
    --text: #F5F5F5; --muted: #A0A0A0;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 5%; background: rgba(13,13,13,0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100;
  }
  .logo { font-size: 24px; font-weight: 700; font-family: 'Playfair Display', serif; }
  .logo .nest { color: var(--yellow); }
  .right-menu { display: flex; align-items: center; gap: 12px; }
  
  .btn { padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid var(--yellow); background: transparent; color: var(--yellow); transition: 0.2s; }
  .btn:hover { background: var(--yellow); color: var(--bg); }

  .container { text-align: center; padding: 50px 20px 20px; max-width: 800px; margin: 0 auto; }
  .container h1 { font-size: 42px; font-weight: 700; line-height: 1.3; font-family: 'Playfair Display', serif; }
  .container h1 .yellow { color: var(--yellow); font-style: italic; }
  
  .top-actions { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
  .btn-add { background: var(--yellow); color: var(--bg); padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: none; }

  /* Story Cards */
  .stories-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px; padding: 0 5% 60px; max-width: 1200px; margin: 0 auto;
  }
  .story-card {
    background: var(--card); padding: 24px; border-radius: 14px; border: 1px solid #2a2a2a;
    text-align: left; transition: 0.3s;
  }
  .story-card:hover { border-color: var(--yellow); }
  .story-card h3 { color: var(--yellow); margin: 0 0 10px; font-family: 'Playfair Display', serif; }
  .story-card p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .story-actions { display: flex; gap: 10px; margin-top: 15px; }
  .btn-tts { background: var(--yellow); color: var(--bg); border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .btn-tts.stop { background: #ff4444; color: white; }

  /* Modal */
  .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
  .modal-content { background: var(--card); padding: 30px; border-radius: 14px; width: 90%; max-width: 400px; border: 1px solid #2a2a2a; }
  .modal-content h2 { color: var(--yellow); text-align: center; margin-bottom: 20px; font-family: 'Playfair Display', serif; }
  .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 12px; margin: 10px 0; background: var(--bg); border: 1px solid #333; border-radius: 8px; color: var(--text); box-sizing: border-box; }
  .close { color: var(--muted); float: right; font-size: 24px; cursor: pointer; }
</style>
</head>
<body>

  <!-- Header -->
  <div class="topbar">
    <div class="logo">📖Story<span class="nest">Nest</span></div>
    <div class="right-menu">
      <!-- Sirf Admin Login button -->
      <button class="btn" id="adminLoginBtn" onclick="openModal('adminModal')">Admin Login</button>
      <button class="btn" id="adminLogoutBtn" style="display:none;" onclick="adminLogout()">Logout</button>
    </div>
  </div>

  <!-- Home Section -->
  <div class="container">
    <h1>Stories that stay with you — <span class="yellow">English & Urdu</span>, in one place.</h1>
    <div class="top-actions">
      <button class="btn-add" id="addStoryBtn" onclick="openModal('addStoryModal')">+ Add New Story</button>
    </div>
  </div>

  <!-- Stories Grid -->
  <div class="stories-grid">
    <div class="story-card">
      <h3>Chand Ka Safar</h3>
      <p>Ek chota larka
