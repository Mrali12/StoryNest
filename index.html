<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest — English & Urdu Stories</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14110F; --surface:#1E1A16; --border:#332C24; --gold:#C9A227; --maroon:#8A3324; --text:#EDE6DA; --text-dim:#A99E8C;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{color:var(--text); font-family:'Inter',sans-serif; background:var(--ink); min-height:100vh; display:flex; flex-direction:column;}
  .urdu{font-family:'Noto Nastaliq Urdu', serif; direction:rtl; line-height:2.1;}
  header{position:sticky; top:0; background:rgba(20,17,15,.92); border-bottom:1px solid var(--border); padding:14px 18px; display:flex; justify-content:space-between;}
  .logo{font-size:1.5rem; font-weight:700; color:var(--text);} .logo span{color:var(--gold);}
  .btn{border:1px solid var(--gold); background:transparent; color:var(--gold); padding:8px 16px; border-radius:8px; cursor:pointer;}
  .btn-solid{background:var(--gold); color:var(--ink);}
  .hero{text-align:center; padding:50px 18px;} .hero h1{font-family:'Lora',serif; font-size:2.2rem;} .hero h1 em{color:var(--gold);}
  .chip-row{display:flex; gap:10px; justify-content:center; padding:0 18px 20px; flex-wrap:wrap;}
  .chip{border:1px solid var(--border); background:var(--surface); color:var(--text-dim); padding:7px 15px; border-radius:20px; cursor:pointer;}
  .chip.active{border-color:var(--gold); color:var(--gold);}
  .grid{max-width:1100px; margin:0 auto; padding:0 18px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:22px; flex:1;}
  .card{background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--maroon); border-radius:14px; overflow:hidden; cursor:pointer;}
  .card:hover{border-top-color:var(--gold);}
  .card-cover{aspect-ratio:3/4; width:100%; object-fit:cover;} /* IMAGE CSS ADD */
  .card-body{padding:14px;}
  .card-cat{color:var(--maroon); font-size:.72rem; font-weight:700; text-transform:uppercase;}
  .card-title{font-family:'Lora',serif; font-size:1.1rem; color:var(--gold); margin:5px 0;}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; display:none; align-items:center; justify-content:center;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; max-width:500px; width:90%; padding:24px; position:relative;}
  .modal-close{position:absolute; top:10px; right:14px; background:none; border:none; color:var(--text-dim); font-size:1.5rem; cursor:pointer;}
  .field{margin-bottom:14px;} .field label{display:block; font-size:.8rem; color:var(--text-dim); margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%; background:var(--ink); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:8px;}
  .reader-body{max-width:700px; background:var(--surface); padding:24px; border-radius:14px;}
  #toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--ink); padding:11px 22px; border-radius:8px; font-weight:600; opacity:0; transition:.25s;}
  #toast.show{opacity:1;}
  footer{border-top:1px solid var(--border); background:var(--surface); padding:40px 18px 20px; margin-top:60px;}
  .footer-inner{max-width:1100px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:30px;}
  .footer-col h3{font-family:'Lora',serif; color:var(--gold); font-size:1.1rem; margin-bottom:12px;}
  .footer-bottom{text-align:center; padding-top:20px; margin-top:20px; border-top:1px solid var(--border); color:var(--text-dim); font-size:.8rem;}
</style>
</head>
