  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

  .right-menu { display: flex; align-items: center; gap: 12px; }

  .btn:hover { background: var(--yellow); color: var(--bg); }

  .container { text-align: center; padding: 50px 20px 20px; max-width: 800px; margin: 0 auto; }

  .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; max-width: 1100px; margin: 0 auto; }
  .game-card { background: var(--bg); padding: 28px 20px; border-radius: 14px; border: 1px solid #2a2a2a; transition: 0.3s; cursor: pointer; text-align: center; }

  .game-card .icon { font-size: 42px; margin-bottom: 12px; }
  .game-card h3 { margin: 0 0 8px; font-size: 18px; color: var(--yellow); font-weight: 600; }

  /* Story Cards */
  .stories-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

  }
  .story-card {
    background: var(--card); padding: 24px; border-radius: 14px; border: 1px solid #2a2a2a;
    text-align: left; transition: 0.3s;
  }
  .story-card:hover { border-color: var(--yellow); }
  .story-card h3 { color: var(--yellow); margin: 0 0 10px; font-family: 'Playfair Display', serif; }
  .story-card p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .story-actions { display: flex; gap: 10px; margin-top: 15px; }
  .btn-tts { background: var(--yellow); color: var(--bg); border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .btn-tts.stop { background: #ff4444; color: white; }

  /* Footer */
  footer {
    background: var(--card); padding: 50px 5% 20px; border-top: 1px solid #222;
  }

  .footer-col a:hover { color: var(--yellow); }
