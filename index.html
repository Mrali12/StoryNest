<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest – English & Urdu</title>
<style>
  body {
    margin: 0;
    background: #120f0f;
    color: #f2e9e1;
    font-family: Georgia, serif;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid #1f1a1a;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
  }
  .logo .nest { color: #e6b800; }

  .right-menu {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .btn-outline {
    border: 1px solid #e6b800;
    color: #e6b800;
    background: transparent;
    padding: 7px 14px;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-outline:hover {
    background: #e6b800;
    color: #120f0f;
  }
  .greet {
    color: #e6b800;
    font-size: 15px;
  }

  .container { text-align: center; padding: 50px 20px 30px; }
  .container h1 { font-size: 42px; font-weight: 500; line-height: 1.4; }
  .container h1 .yellow { color: #e6b800; font-style: italic; font-weight: 700; }

  .tags {
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 35px;
  }
  .tag {
    padding: 9px 20px; border-radius: 25px; background: #1f1a1a;
    color: #aaa; border: 1px solid #2a2424; cursor: pointer; font-size: 15px;
  }
  .tag.active {
    background: transparent; border: 1px solid #e6b800; color: #e6b800;
  }

  .banner {
    width: 92%; max-width: 900px; margin: 35px auto; display: block; border-radius: 8px;
  }
</style>
</head>
<body>

  <!-- Header -->
  <div class="topbar">
    <div class="logo">
      📖Story<span class="nest">Nest</span>
    </div>
    <div class="right-menu">
      <button class="btn-outline">🎮 Games</button>
      
      <!-- Yahan 2 option hain. Ek waqt me sirf ek show karo -->
      <!-- Option 1: Jab user Login NAHI hai -->
      <button class="btn-outline">Login</button>

      <!-- Option 2: Jab user Login HAI -->
      <!-- 
      <div class="greet">Hi, Ali raza</div>
      <button class="btn-outline">Logout</button>
      -->
    </div>
  </div>

  <!-- Hero Section -->
  <div class="container">
    <h1>
      Stories that stay <br>
      with you — <br>
      <span class="yellow">English & Urdu</span>, in <br>
      one place.
    </h1>

    <div class="tags">
      <div class="tag active">All</div>
      <div class="tag">Romance</div>
      <div class="tag">Horror</div>
      <div class="tag">Adventure</div>
      <div class="tag">Comedy</div>
    </div>
  </div>

  <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200" 
       class="banner" alt="Mountain">

</body>
</html>
