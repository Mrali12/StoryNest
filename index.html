<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryNest — Stories + 3 Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#050A18; color:#E8F0FF;}
header{padding:15px 20px; background:#0F1A2F; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10}
.logo{font-size:24px; font-weight:bold}
.logo span{color:#4DA8DA}
.btn{border:1px solid #4DA8DA; background:transparent; color:#4DA8DA; padding:8px 15px; border-radius:6px; cursor:pointer; margin-left:8px}
.btn-solid{background:#4DA8DA; color:#050A18; font-weight:bold}
.hero{text-align:center; padding:60px 20px}
.games{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; padding:40px 20px; max-width:1200px; margin:auto}
.card{background:#0F1A2F; padding:25px; border-radius:12px; border:1px solid #1F2F4D; text-align:center}
.card h3{color:#4DA8DA; margin-bottom:10px}
.overlay{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; z-index:999}
.overlay.show{display:flex}
.modal{background:#0F1A2F; padding:30px; border-radius:10px; width:90%; max-width:400px; border:1px solid #4DA8DA}
input{width:100%; padding:12px; margin:8px 0; background:#050A18; border:1px solid #1F2F4D; color:white; border-radius:5px}
.game-box{background:#050A18; padding:15px; border-radius:10px; margin-top:15px; border:1px solid #1F2F4D}
canvas{background:#000; border:2px solid #4DA8DA; border-radius:5px}
#tttBoard{display:grid; grid-template-columns:repeat(3, 70px); gap:5px; margin:auto; justify-content:center}
.cell{width:70px; height:70px; background:#050A18; border:2px solid #4DA8DA; font-size:35px; display:flex; align-items:center; justify-content:center; cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="logo">📖 Story<span>Nest</span></div>
  <div id="headerBtns">
    <button class="btn" id="loginBtn">Log In</button>
    <button class="btn btn-solid" id="signupBtn">Sign Up</button>
  </div>
</header>

<div class="hero">
  <h1>Stories that stay with you</h1>
  <h2 style="color:#4DA8DA">English & Urdu + 3 Games</h2>
</div>
